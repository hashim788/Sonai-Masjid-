<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1f3a">
<title>Sonai — Masjid & Madarsa</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Poppins',sans-serif;}
body{
  background:linear-gradient(160deg,#0a1628 0%,#0d2d4a 40%,#0a3015 100%);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;position:relative;
}
body::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 20%,rgba(201,168,76,.12) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,rgba(26,107,58,.2) 0%,transparent 50%);
  pointer-events:none;
}
.container{text-align:center;padding:32px 24px;width:100%;max-width:400px;position:relative;z-index:1;animation:fadeIn .6s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.bismillah{font-family:'Amiri',serif;font-size:22px;color:#e8c86a;margin-bottom:20px;opacity:.9;}
.logo{font-size:56px;margin-bottom:10px;animation:pulse 3s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
h1{font-family:'Amiri',serif;font-size:32px;color:#fff;font-weight:700;margin-bottom:4px;}
.subtitle{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:24px;}
.live-dot{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:20px;font-size:11px;color:rgba(255,255,255,.7);margin-bottom:28px;font-weight:600;}
.live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:#2ecc71;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.question{font-size:14px;font-weight:600;color:rgba(255,255,255,.8);margin-bottom:18px;}
.options{display:flex;flex-direction:column;gap:14px;}
.option-btn{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:18px;border:none;cursor:pointer;font-family:'Poppins',sans-serif;text-decoration:none;transition:transform .15s;position:relative;overflow:hidden;}
.option-btn:active{transform:scale(.97);}
.btn-masjid{background:linear-gradient(135deg,#0f4a1f,#1a6b3a);box-shadow:0 8px 32px rgba(26,107,58,.4);border:1.5px solid rgba(255,255,255,.15);}
.btn-madarsa{background:linear-gradient(135deg,#0d2d5a,#1a4a8a);box-shadow:0 8px 32px rgba(26,74,138,.4);border:1.5px solid rgba(255,255,255,.15);}
.btn-icon{font-size:38px;flex-shrink:0;line-height:1;}
.btn-text{text-align:left;flex:1;}
.btn-title{font-size:18px;font-weight:800;color:#fff;margin-bottom:3px;}
.btn-sub{font-size:11px;color:rgba(255,255,255,.65);}
.btn-arrow{font-size:22px;color:rgba(255,255,255,.5);flex-shrink:0;}
.footer{margin-top:36px;font-size:10.5px;color:rgba(255,255,255,.3);}
.footer span{color:#e8c86a;opacity:.6;}
</style>
</head>
<body>
<div class="container">
  <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <div class="logo">🕌</div>
  <h1>Sonai</h1>
  <p class="subtitle">Collection & Management System</p>
  <div class="live-dot">Live System</div>
  <p class="question">Aap kya dekhna chahte hain?</p>
  <div class="options">
    <a href="masjid.html" class="option-btn btn-masjid">
      <span class="btn-icon">🕌</span>
      <div class="btn-text">
        <div class="btn-title">Masjid</div>
        <div class="btn-sub">Chanda · Members · Campaigns</div>
      </div>
      <span class="btn-arrow">›</span>
    </a>
    <a href="madarsa.html" class="option-btn btn-madarsa">
      <span class="btn-icon">📚</span>
      <div class="btn-text">
        <div class="btn-title">Madarsa</div>
        <div class="btn-sub">Students · Fees · Attendance</div>
      </div>
      <span class="btn-arrow">›</span>
    </a>
  </div>
  <div class="footer">Sonai Masjid & Madarsa · <span>hashim788.github.io</span></div>
</div>
</body>
</html>
